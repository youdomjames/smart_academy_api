server:
  port: 9005
  servlet:
    context-path: /api/v1
spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: smart-academy-api
            authorization-grant-type: authorization_code
            scope:
              - openid
        provider:
          keycloak:
            issuer-uri: http://localhost:8000/realms/smart-academy
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8000/realms/smart-academy

  application:
    name: course-service
  data:
    mongodb:
      auto-index-creation: true
      uri: mongodb://localhost:27017/courses
    redis:


  task:
    scheduling:
      pool:
        size: 5
management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    com.youdomjames.course_service: DEBUG
    org.springframework.data: INFO
    web: DEBUG

application:
  title: Course Service
  version: v1.0.0

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/